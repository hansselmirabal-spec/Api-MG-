name: Deploy to Sandbox (condor-qas)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-qas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Write JWT key file
        run: echo "${{ secrets.SF_JWT_KEY_QAS }}" > server.key

      - name: Authenticate to condor-qas
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY_QAS }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME_QAS }}" \
            --instance-url "https://test.salesforce.com" \
            --alias condor-qas

      - name: Deploy + run MGAgencia tests
        run: |
          sf project deploy start -o condor-qas -d force-app/main/default \
            --test-level RunSpecifiedTests \
            --tests MGAgenciaLeadRestResourceTest \
            --tests MGAgenciaLeadServiceTest \
            --tests MGAgenciaPlatformResolverTest \
            --tests MGAgenciaDuplicateEvaluatorTest \
            --tests MGAgenciaPhoneNormalizerTest \
            --tests MGAgenciaBranchResolverTest \
            --tests MGAgenciaContactPreferenceResolverTest \
            --wait 30

      - name: Cleanup key file
        if: always()
        run: rm -f server.key
