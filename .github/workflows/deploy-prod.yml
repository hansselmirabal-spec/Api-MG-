name: Deploy to Production (mi-org)

on:
  push:
    branches: [production]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@2.23.20

      - name: Write JWT key file
        run: echo "${{ secrets.SF_JWT_KEY_PROD }}" > server.key

      - name: Authenticate to mi-org
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY_PROD }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME_PROD }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL_PROD }}" \
            --alias mi-org

      - name: Deploy + run MGAgencia tests
        run: |
          sf project deploy start -o mi-org -d force-app/main/default \
            --test-level RunSpecifiedTests \
            --tests MGAgenciaLeadRestResourceTest \
            --tests MGAgenciaLeadServiceTest \
            --tests MGAgenciaPlatformResolverTest \
            --tests MGAgenciaDuplicateEvaluatorTest \
            --tests MGAgenciaPhoneNormalizerTest \
            --tests MGAgenciaBranchResolverTest \
            --tests MGAgenciaContactPreferenceResolverTest \
            --wait 30

      - name: Cleanup key file
        if: always()
        run: rm -f server.key
